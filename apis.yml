name: Century 21 Canada
kind: company
description: >-
  CENTURY 21 Canada Limited Partnership is the Canadian master franchisor of the CENTURY 21® real
  estate brand, headquartered at 1285 West Pender Street in Vancouver, British Columbia. The master
  licence for Canada was secured in Vancouver in 1976 — the first international franchise of the
  CENTURY 21 System — and the network today spans roughly 400 independently owned and operated
  offices from coast to coast. Century 21 Canada sits in the brokerage/franchisor layer of the
  Canadian real estate value chain: it does not originate listing data, it consumes it. Canadian
  residential listings are consolidated nationally by the Canadian Real Estate Association (CREA),
  which runs REALTOR.ca and the Data Distribution Facility (DDF®); franchisors and brokerages
  redistribute that member-owned MLS® content under CREA rules rather than publishing it
  themselves. Century 21 Canada's API posture is accordingly empty. As of a 2026-07-26 probe there
  is no developer portal, no API documentation, no published base URL, no SDK, no webhooks, no
  Postman collection and no machine-readable contract of any kind on century21.ca or c21.ca — both
  century21.ca and c21.ca resolve to the same WordPress consumer site whose terms of use name
  MoxiWorks LLC as the site operator, and whose property search is a hosted MoxiWorks Web Marketing
  System surface rather than a first-party API. Wildcard DNS on *.century21.ca and *.c21.ca returns
  HTTP 200 for every subdomain probed (developer., developers., api., docs.) by parking them all on
  eboat.moxiworks.com, so those 200s are a DNS artifact and not a developer portal. RESO is absent:
  no RESO Web API or Data Dictionary certification, no OData or $metadata endpoint, and no Universal
  Property Identifier reference appears anywhere in the public surface — consistent with Canada,
  where RESO certification is not the operative seam and CREA's DDF® is. The only genuinely public,
  anonymously callable machine-readable surface found is the incidental WordPress REST API route
  index at https://www.c21.ca/wp-json/, which is a CMS artifact, is undocumented by Century 21
  Canada, and is deliberately not listed here as a product API. Agent- and franchisee-facing tools
  live behind the hub21.ca member login. This profile is therefore identity-only and honestly
  records a brokerage franchisor with no published developer surface.
