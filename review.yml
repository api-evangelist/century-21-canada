aid: century-21-canada
name: Century 21 Canada
review:
  question: >-
    Does Century 21 Canada publish a public, developer-reachable API — and what is its RESO posture
    and access gate?
  answer: false
  date: '2026-07-26'
  reviewer: API Evangelist
  homeMarket: Canada
  tier: brokerage
  openapiHarvested: false
  specsCount: 0
sector:
  resoPosture: >-
    No RESO reference found. Century 21 Canada shows no RESO Web API certification, no RESO Data
    Dictionary certification (no version claim of any kind), no listing in any RESO certification
    directory that could be confirmed, no OData service root, no $metadata document, and no
    Universal Property Identifier (UPI) usage. The strings "RESO", "OData", "$metadata", "UPI" and
    "DDF" were searched for in the fetched HTML of https://www.c21.ca/ , https://www.c21.ca/search/
    and a live listing detail page — zero genuine hits (the only "ddf" substrings were inside a
    Brytecore UUID and an emoji-polyfill script, not data-standard references). This is the expected
    and honest Canadian answer: RESO certification is a US MLS-layer artifact, and Canadian listing
    distribution runs instead through CREA's national Data Distribution Facility (DDF®), which CREA
    describes as normalized to the RESO Data Dictionary. A brokerage franchisor like Century 21
    Canada is a DOWNSTREAM consumer of that pool, not a certified data provider, so there is nothing
    for it to certify.
  resoCertified: false
  resoDirectoryEvidence: >-
    https://certification.reso.org/ was probed directly on 2026-07-26 and returned HTTP 400 to a
    plain client (and empty content to the fetch tool), so the directory could not be queried
    programmatically; https://www.reso.org/certification/ returned HTTP 200. No Century 21 Canada
    entry was found via search either. Absence is therefore recorded as "not found / not claimed"
    rather than "confirmed absent from the directory" — but Century 21 Canada makes no certification
    claim anywhere on its own public surface, which is the defensible fact.
  accessGate: none-published
  accessGateDetail: >-
    There is nothing for a developer to sign up for, apply to, license, or join at Century 21 Canada,
    because no API is published at all. What a developer must do to obtain the underlying data is a
    separate matter and belongs to other parties in the chain: Canadian MLS® listing content is
    reachable only through CREA's REALTOR.ca DDF® Web API, which requires REALTOR®/board membership
    and data-feed credentials created in CREA's member portal, or through a board/association IDX or
    VOW data licence agreement. Century 21 Canada's own gated surfaces are people-gates, not API
    gates: https://my.hub21.ca/ returned HTTP 302 to /sessions/new (agent/franchisee login,
    MoxiWorks-hosted) and https://engage.hub21.ca/ returned HTTP 302 to /sessions/new. The consumer
    site's MoxiWorks configuration carries a Virtual Office Website (VOW) feature flag
    ("vow":{"name":"Virtual Office Website","enabled":0}) — the VOW registration wall exists in the
    platform but is switched OFF for this brand, so no consumer registration gate is active either.
  openData: false
  openDataDetail: >-
    No open data product exists. Canada has no HM Land Registry Price Paid or Ordnance Survey
    equivalent at the national level, and land registration is provincial and largely privatised
    (Teranet operates Ontario's registry under a long concession), so the public record itself is a
    commercial product. Century 21 Canada publishes no dataset, no bulk download, and no unlicensed
    feed. Its terms of use (https://www.c21.ca/terms-of-use , HTTP 200) name MoxiWorks LLC as site
    operator and state that property information and photographs are "provided by the listing agent
    and/or by the multiple listing service (MLS) ... and may not be copied or used in any manner
    without the express permission of the copyright owner", that the user must "comply with the MLS
    terms and to only access and use the MLS content for which You are authorized", and prohibit
    downloading, copying, transmitting, or creating derivative works of the site. The in-search
    disclaimer additionally carries CREA's REALTOR®/MLS® trademark and "screen scraping" /
    "database scraping" prohibitions.
  authModel: >-
    No API authentication model is published, because there is no API. No OAuth, no API keys, no
    documented scopes. https://century21.ca/.well-known/openid-configuration and
    https://www.c21.ca/.well-known/openid-configuration both returned HTTP 403 (WAF/deny, not a
    served discovery document). Human authentication for agents and franchisees is a MoxiWorks
    session login at my.hub21.ca / engage.hub21.ca (HTTP 302 to /sessions/new). The public WordPress
    REST API reports "authentication":[] — i.e. no authentication schemes are advertised for it.
  valueChainPosition: >-
    Brokerage franchisor. Master licensee of the CENTURY 21® brand for Canada (licence secured in
    Vancouver in 1976, the CENTURY 21 System's first international franchise), roughly 400
    independently owned and operated offices, HQ 1285 West Pender Street, Vancouver, BC V6E 4B1. It
    consumes member-owned MLS® data distributed by CREA and resells brand, tools, and lead flow to
    franchisees; it does not operate an MLS, a registry, or a data pipe.
