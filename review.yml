  - url: https://my.hub21.ca/.well-known/security.txt
    status: '404'
    note: Member-portal host publishes no security.txt.
  wordpressRestApiReexamined: >-
    The incidental WordPress route index at https://www.c21.ca/wp-json/ was re-parsed in round 2:
    210 routes across 13 namespaces, all of which are WordPress core (wp/v2, wp-site-health,
    wp-block-editor, oembed) or third-party plugin management surfaces (Wordfence, WPML, Yoast,
    OTGS installer, bsf-core). The single Century 21-specific namespace is "/services", whose only
    operation is POST /services/create_lead — a site lead-capture endpoint, not a data API. It was
    NOT invoked. This reconfirms round 1's decision to keep the WordPress REST API out of apis[]:
    it is a CMS artifact, undocumented by the provider, and listing it would misrepresent a
    franchisor that publishes no developer surface.
  artifactsNotEmitted:
    reason: >-
      Most pipeline artifacts are derivable only from a machine-readable contract, and this provider
      has none. The following were evaluated and deliberately skipped rather than fabricated.
    skipped:
    - {artifact: openapi/, reason: No OpenAPI or Swagger document exists on any host.}
    - {artifact: packages/, reason: No first-party SDK on npm, PyPI, or any registry; no SDKs pointer earned.}
    - {artifact: well-known/, reason: Zero /.well-known documents returned 200; a WellKnown pointer would be unearned.}
    - {artifact: mcp/, reason: No hosted MCP server, and no OpenAPI from which to derive candidate tools.}
    - {artifact: mcp/ tool-crosswalk, reason: Requires an MCP or GraphQL surface plus an OpenAPI; none exist.}
    - {artifact: overlays/, reason: An Overlay extends an OpenAPI document; there is none to extend.}
    - {artifact: grpc/, reason: No GitHub org, no buf.build presence, no published .proto.}
    - {artifact: conformance/, reason: No spec to derive from and no published compliance claims; would be empty assertions.}
    - {artifact: errors/, reason: Error catalogs derive from OpenAPI 4xx/5xx responses; no spec exists.}
    - {artifact: lifecycle/, reason: No API means no versioning or deprecation policy; no status page found, and subdomain probes are unreliable here due to wildcard DNS.}
    - {artifact: scopes/, reason: No OAuth surface anywhere.}
    - {artifact: authentication/, reason: No securitySchemes to derive from; there is no API to authenticate to.}
    - {artifact: sandbox/, reason: No test environment, keys, or fixtures published.}
    - {artifact: conventions/, reason: No documented request/response semantics and no spec; no idempotency contract, so no Idempotency pointer.}
    - {artifact: changelog/, reason: No dated API changelog; the blog is marketing content.}
    - {artifact: cli/, reason: No first-party CLI.}
    - {artifact: components/, reason: No embeddable component library published by Century 21 Canada; the site embeds MoxiWorks widgets.}
    - {artifact: data-model/, reason: Entity graph derives from OpenAPI $ref links; no spec exists.}
    - {artifact: asyncapi/, reason: No event, streaming, or webhook surface. Not penalized — this provider has no event surface to document.}
    - {artifact: skills/, reason: Agent Skills must be grounded in real operationIds; there is no spec to ground them in.}
    - {artifact: agentic-access/, reason: Generated by classifying OpenAPI operations; none exist.}
    - {artifact: arazzo/, reason: Workflows stitch real operations; none exist.}
    - {artifact: security/ vulnerability-disclosure, reason: Probe found no security.txt Policy/Contact, no bug bounty, and no disclosure page. No Security pointer earned.}
    - {artifact: security/ trust-center, reason: Probe found no trust center and no named certifications. No Compliance or TrustCenter pointer earned.}
  artifactsEmitted:
  - artifact: security/century-21-canada-domain-security.yml
    type: DomainSecurity
    method: probed
    note: >-
      www.c21.ca serves TLSv1.3 with HSTS max-age 31536000. Registrable domain c21.ca has SPF and
      DMARC (policy p=none — monitoring only, not enforcing), no DNSSEC, and no CAA records.
      Absence of DNSSEC and CAA is recorded as valid probed data.
  - artifact: llms/century-21-canada-llms.txt
    type: LLMsTxt
    method: generated
    note: >-
      Generated from apis.yml and this review because /llms.txt is WAF-blocked and the provider
      publishes none. Its central content is the explicit statement that no API exists, plus the
      redirect to CREA/DDF as the real Canadian listing seam and the note that the site terms
      prohibit automated harvesting.
