actions:
  apisYmlCreated: true
  apisListed: 0
  openapiDirCreated: false
  reason: >-
    apis[] is intentionally empty. Nothing real, documented, and provider-published was found to
    list, and no OpenAPI, Swagger, or OData $metadata document was harvestable, so no openapi/
    directory was created. Listing the incidental WordPress REST API as a product API would
    misrepresent this provider.
enrichmentRounds:
- round: 2
  date: '2026-07-26'
  outcome: confirmed-no-api
  summary: >-
    Round 2 re-ran full contract discovery against every host and every registry, and the round-1
    "no published API" verdict holds unchanged. No OpenAPI, Swagger, GraphQL SDL, AsyncAPI, MCP
    manifest, .proto, SDK, CLI, or Postman collection exists for this provider. The only net-new
    artifacts are a probed domain-security posture and a generated llms.txt whose purpose is to
    state the absence explicitly so agents stop probing for a developer surface.
  contractDiscovery: >-
    The pipeline's harder-hunt sequence was applied in full. REST spec probes were run against the
    API host root and the docs host, not just the docs shell; GraphQL introspection was attempted;
    MCP tools/list had no server to target. All misses. A WAF ("Access Denied", HTTP 403) fronts
    www.c21.ca and blocks /.well-known/* and /llms.txt to non-browser clients, so those 403s are a
    WAF artifact rather than proof of absence — but no evidence of any such document exists in the
    site HTML, sitemap, or robots.txt either. Because zero /.well-known documents returned 200, no
    well-known/ artifact and no WellKnown pointer were emitted.
  wildcardDnsControl: >-
    A control probe of https://zzznotreal.c21.ca returned HTTP 200 with the generic title "Agent
    Websites", confirming round 1's finding that *.c21.ca wildcard DNS makes every subdomain 200.
    Any future subdomain 200 for this provider must be treated as parking unless it returns a
    distinct branded title. join.c21.ca ("Century 21 Careers") and quebec.c21.ca ("Century 21
    Québec") passed that test and were added to apis.yml; developer./api./docs. did not.
  probes:
  - url: https://www.c21.ca/llms.txt
    status: '403'
    note: WAF "You are not allowed to access this resource" — blocked, not confirmed absent.
  - url: https://www.c21.ca/.well-known/api-catalog
