findings:
  summary: >-
    Century 21 Canada is a brokerage franchisor with no published developer surface whatsoever. No
    developer portal, no API documentation, no base URL, no OpenAPI, no OData $metadata, no GraphQL,
    no webhooks or events, no SDKs, no CLI, no Postman collection, no status page for any API, and no
    changelog. Every classic developer subdomain answers HTTP 200 only because *.century21.ca and
    *.c21.ca are wildcarded onto eboat.moxiworks.com — a control probe against a nonsense subdomain
    reproduced the same 200, so those responses are worthless as evidence of a portal. The single
    distinct host, api.c21.ca, is a 2019-vintage IIS placeholder returning the three characters
    "API". The consumer website itself is operated by MoxiWorks LLC per its own terms of use, and its
    listing search, listing detail pages, agent hub and lead capture are all MoxiWorks platform
    surfaces rather than Century 21 Canada APIs.
  centralQuestion: >-
    This organization is a clean negative case for the sector's central question. There is no
    certification and no reachability — the two facts do not have to be separated here because
    neither exists. RESO is absent because Canada does not run on RESO certification: it runs on
    CREA's single national DDF® cooperative, and a franchisor is a licensee of that pool rather than
    a certified data provider. The gate is therefore not "certified but closed" — it is
    "none-published", with the real gate located one layer up at CREA (membership plus a signed data
    licence).
  webhooksEventsSdksPostman:
    webhooks: false
    events: false
    sdks: false
    cli: false
    postman: false
    graphql: false
    note: None found. Absence across all six is itself the finding for a franchisor of this size.
  productApiFamily: >-
    None published. The product segmentation a developer would want — listings/search, agent and
    office directory, commercial listings, neighbourhood/market reports, mortgage calculation, lead
    capture — all exists as HTML pages on c21.ca (/search/, /directory, /commercial-listings,
    /neighborhood-news, /mortgage-calculator) and as MoxiWorks-hosted functionality, but none of it
    is exposed as a documented API.
  incidentalMachineReadableSurfaces:
    - url: https://www.c21.ca/wp-json/
      kind: WordPress REST API route index
      documented_by_provider: false
      note: Real and anonymously callable, but a CMS artifact; excluded from apis[] on purpose.
    - url: https://www.c21.ca/feed
      kind: RSS
      documented_by_provider: false
    - url: https://www.c21.ca/sitemap.xml
      kind: XML sitemap
      documented_by_provider: false
  platformVendor: >-
    MoxiWorks LLC (Washington LLC) — named as site operator in the Century 21 Canada terms of use.
    Supplies the Web Marketing System consumer site and search, the listings and imaging hosts, the
    agent hub (hub21.ca / my.hub21.ca / engage.hub21.ca), CMA tooling, and the lead pipeline. Any API
    capability in this stack is MoxiWorks' to publish, not Century 21 Canada's.
